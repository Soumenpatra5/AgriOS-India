name: Release stale orders

# Sweeps abandoned (unpaid) checkouts and returns their reserved stock.
#
# Why it lives here and not in vercel.json: Hobby plans allow only DAILY cron
# jobs, so the "*/15 * * * *" entry made Vercel reject every deployment at
# validation — no build, no logs, just a silently stale site.
#
# Why it talks to Postgres directly instead of calling an endpoint: Hobby also
# caps a deployment at 12 Serverless Functions, and the commerce backend had
# grown to 13. Running the sweep here removes the HTTP route entirely, which
# both frees the slot and leaves no public endpoint to secure.
#
# Caveats worth knowing: GitHub's scheduler is best-effort and can run late
# under load, and it disables scheduled workflows after 60 days of repository
# inactivity. Neither matters much for a 30-minute reservation TTL, but this is
# not the hard guarantee Vercel Cron gave.
#
# No-ops (exit 0) while DATABASE_URL is absent, matching db-migrate.yml — the
# Supabase project is not wired up on every environment yet, and a job failing
# every 15 minutes would bury real failures in a wall of red.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-stale
  cancel-in-progress: false

jobs:
  release:
    name: Release abandoned reservations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - name: Run reservation sweep
        run: npm run release-stale
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ORDER_RESERVATION_TTL_MIN: ${{ vars.ORDER_RESERVATION_TTL_MIN }}
